{% extends "dashboard/layout.html" %}

{% block title %}
Delete Student
{% endblock %}

{% block content %}

<div class="card shadow">
    <div class="card-body">

        <h3 class="text-danger">
            Delete Student
        </h3>

        <hr>

        <p>
            Are you sure you want to delete
            <strong>
                {{ student.user.get_full_name }}
            </strong>
            ?
        </p>

        <form method="POST">

            {% csrf_token %}

            <button type="submit"
                    class="btn btn-danger">

                Yes, Delete

            </button>

            <a href="{% url 'student_list' %}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>
</div>

{% endblock %}
