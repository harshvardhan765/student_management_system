<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Management System{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🎓 Student Management System
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/"><i class="bi bi-house"></i> Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/dashboard/"><i class="bi bi-speedometer2"></i> Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/students/"><i class="bi bi-people"></i> Students</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/teachers/"><i class="bi bi-person-workspace"></i> Teachers</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/courses/"><i class="bi bi-book"></i> Courses</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/attendance/"><i class="bi bi-calendar-check"></i> Attendance</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-warning" href="/api/docs" target="_blank"><i class="bi bi-code-slash"></i> API Docs</a>
                </li>

                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link text-danger" href="/accounts/logout/"><i class="bi bi-box-arrow-right"></i> Logout ({{ user.username }})</a>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="/accounts/login/"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                </li>
                {% endif %}

            </ul>

        </div>

    </div>
</nav>

<!-- Page Content -->
<div class="container mt-5">

    {% block content %}
    {% endblock %}

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
