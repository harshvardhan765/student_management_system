{% extends "dashboard/layout.html" %}

{% block title %}
Delete Teacher
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-body">

        <h3 class="text-danger">
            Delete Teacher
        </h3>

        <hr>

        <p>

            Are you sure you want to delete

            <strong>

                {{ teacher.user.get_full_name }}

            </strong>

            ?

        </p>

        <form method="POST">

            {% csrf_token %}

            <button type="submit"
                    class="btn btn-danger">

                Yes, Delete

            </button>

            <a href="{% url 'teacher_list' %}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
